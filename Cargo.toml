[package]
name = "xlurm"
version = "0.1.0"
edition = "2024"
description = "A minimal, multi-user single-machine GPU and Ascend scheduler"
license = "MIT"
default-run = "xlurm"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
